services:
  inkling2-mini-sglang:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:inkling-2-mini}
    container_name: inkling2-mini-sglang
    pull_policy: if_not_present
    restart: unless-stopped
    stop_grace_period: 15s
    ipc: host
    shm_size: 32g
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - "${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface"
      - "./overlay/sglang_inkling_dflash2.py:/usr/local/share/sglang_inkling_dflash2.py:ro"
      - "./overlay/inkling2_moe.py:/sgl-workspace/sglang/python/sglang/srt/models/inkling_common/inkling2_moe.py:ro"
    environment:
      - MAX_JOBS=4
      - HF_HUB_DISABLE_XET=1
      - HF_TOKEN=${HF_TOKEN:-}
      - API_KEY=${API_KEY:-}
      - MODEL_ID=${MODEL_ID:-thinkingmachines/Inkling-2-Mini}
      - DRAFT_MODEL_ID=${DRAFT_MODEL_ID:-incoai/Inkling-2-Mini-DFlash2}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - SGLANG_PAGE_SIZE=${SGLANG_PAGE_SIZE:-16}
      - SGLANG_NUM_DRAFT_TOKENS=${SGLANG_NUM_DRAFT_TOKENS:-8}
      - SGLANG_MEM_FRACTION=${SGLANG_MEM_FRACTION:-0.45}
      - SGLANG_CUDA_GRAPH_MAX_BS=${SGLANG_CUDA_GRAPH_MAX_BS:-8}
      - SGLANG_FLASHINFER_MOE_FUSED_FINALIZE=1
      - SGLANG_OPT_MOE_QUANT_ONCE=1
    command:
      - /bin/bash
      - -lc
      - >-
        python3 /usr/local/share/sglang_inkling_dflash2.py &&
        exec sglang serve
        --model-path "$MODEL_ID"
        --tp 1 --ep 1
        --attention-backend fa4
        --dtype bfloat16
        --page-size "$SGLANG_PAGE_SIZE"
        --speculative-algorithm DFLASH
        --speculative-draft-model-path "$DRAFT_MODEL_ID"
        --speculative-num-draft-tokens "$SGLANG_NUM_DRAFT_TOKENS"
        --speculative-draft-attention-backend fa4
        --mem-fraction-static "$SGLANG_MEM_FRACTION"
        --cuda-graph-max-bs-decode "$SGLANG_CUDA_GRAPH_MAX_BS"
        --grammar-backend xgrammar
        --enable-multimodal
        --reasoning-parser inkling
        --tool-call-parser inkling2
        --host "$HOST"
        --port "$PORT"
        ${API_KEY:+--api-key "$API_KEY"}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-8000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 480s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
